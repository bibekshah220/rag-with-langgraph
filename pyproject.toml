[project]
name = "rag-with-langgraph"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "bibekshah220", email = "bibekshah425@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.14.3",
    "langchain>=1.3.14",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.3.2",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langgraph>=1.2.10",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=5.6.1",
    "streamlit>=1.40.0",
]

[project.scripts]
rag-with-langgraph = "rag_with_langgraph:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
